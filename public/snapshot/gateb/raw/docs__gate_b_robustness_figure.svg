<text x="634" y="230" font-size="11" fill="#6b7280">E-value 2.13 at 0.3</text>
<text x="634" y="268" font-size="11.5" font-weight="700" fill="#1a1c22">E-value</text>
<text x="634" y="286" font-size="10.5" fill="#6b7280">strength a hidden</text>
<text x="634" y="301" font-size="10.5" fill="#6b7280">common cause needs</text>
<text x="634" y="316" font-size="10.5" fill="#6b7280">on both arms to</text>
<text x="634" y="331" font-size="10.5" fill="#6b7280">reach independence.</text>
<text x="634" y="346" font-size="10.5" fill="#6b7280">Larger = more robust.</text>
<text x="74" y="540" font-size="11" fill="#6b7280">Every interval excludes 1.0. The coupling attenuates as the threshold tightens and does not reach independence in the measured range.</text>
<text x="74" y="555" font-size="11" fill="#6b7280">Association after declared conditioning, not a causal effect. Two published detection outputs on one public split. Camera axis replicated with a second detector (FCOS3D, Result Q); retained as proposed.</text>
