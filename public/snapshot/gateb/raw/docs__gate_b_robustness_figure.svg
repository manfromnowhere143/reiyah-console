<text x="74" y="56" font-size="13" fill="#6b7280">Conditional joint-failure coefficient on nuScenes val, after class, range, visibility, weather and motion.</text>
<text x="74" y="73" font-size="13" fill="#6b7280">Above 1.0 means the two channels miss the same objects more than independence predicts. Higher is worse.</text>
