<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f3ee" />
    <script>
      /* ground restore, before first paint — no flash, ever */
      (function () {
        try {
          var g = localStorage.getItem("harbor-ground") || "light";
          document.documentElement.dataset.ground = g;
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.content = g === "dark" ? "#050507" : "#f4f3ee";
        } catch (e) {
          document.documentElement.dataset.ground = "light";
        }
      })();
      /* Exact app height and an unscrollable document — the iOS contract.
         A fixed root sized by 100vh or 100dvh can lock to the wrong viewport
         on first paint and never recover until a reload. Two facts must hold
         at every moment: (1) --app-h equals the real visible height, and (2)
         the document is scrolled to 0, because on iOS a fixed root above a
         scrolled document appears pushed off the top of the screen. Both are
         re-established at every moment they can change: resize, orientation,
         bfcache restore, the visual viewport's own resize and scroll, page
         scroll, and several timeouts after load to catch the toolbar settle
         Safari does not always signal.
         Diagnostics: open the site with ?diag=1 to see the live readings and
         the timeline of what the browser reported since the first byte. */
      (function () {
        var d = document.documentElement;
        var log = (window.__harborLog = []);
        var t0 = performance.now();
        function reading(why) {
          var vv = window.visualViewport;
          return {
            t: Math.round(performance.now() - t0), why: why,
            ih: window.innerHeight, iw: window.innerWidth,
            vvh: vv ? Math.round(vv.height) : null, vvw: vv ? Math.round(vv.width) : null,
            vvot: vv ? Math.round(vv.offsetTop) : null, vvpt: vv ? Math.round(vv.pageTop) : null,
            vvs: vv ? +vv.scale.toFixed(3) : null,
            sy: Math.round(window.scrollY || window.pageYOffset || 0),
            dch: d.clientHeight, dsh: d.scrollHeight, sh: screen.height,
            apph: d.style.getPropertyValue("--app-h")
          };
        }
        function setH(why) {
          var r = reading(why);
          if (log.length < 80) log.push(r);
          var h = r.vvh || r.ih;
          if (h) d.style.setProperty("--app-h", h + "px");
          if (r.sy || r.vvpt) { try { window.scrollTo(0, 0); } catch (e) {} }
        }
        var fire = function (why) { return function () { setH(why); }; };
        setH("first");
        addEventListener("resize", fire("resize"), { passive: true });
        addEventListener("scroll", fire("scroll"), { passive: true });
        addEventListener("orientationchange", function () { setH("orient"); setTimeout(fire("orient+300"), 300); });
        addEventListener("pageshow", fire("pageshow"));
        addEventListener("focus", fire("focus"));
        document.addEventListener("visibilitychange", fire("visibility"));
        if (window.visualViewport) {
          window.visualViewport.addEventListener("resize", fire("vv.resize"), { passive: true });
          window.visualViewport.addEventListener("scroll", fire("vv.scroll"), { passive: true });
        }
        addEventListener("DOMContentLoaded", fire("dom"));
        addEventListener("load", function () {
          setH("load");
          [60, 250, 600, 1200, 2500].forEach(function (ms) { setTimeout(fire("load+" + ms), ms); });
        });
        /* ---- the diagnostic overlay: readings, not assumptions ---- */
        if (/[?&]diag=1/.test(location.search)) {
          addEventListener("DOMContentLoaded", function () {
            var o = document.createElement("pre");
            o.id = "diag";
            o.style.cssText = "position:absolute;left:0;right:0;top:35%;margin:0;z-index:100000;background:rgba(255,220,0,.94);color:#000;font:10px/1.35 Menlo,monospace;padding:6px 8px;white-space:pre-wrap;word-break:break-all;pointer-events:none;max-height:60%;overflow:hidden";
            document.body.appendChild(o);
            var render = function () {
              var r = reading("now");
              var lines = ["NOW ih=" + r.ih + " vvh=" + r.vvh + " vvot=" + r.vvot + " vvpt=" + r.vvpt + " sy=" + r.sy + " dch=" + r.dch + " dsh=" + r.dsh + " sh=" + r.sh + " apph=" + r.apph + " ua=" + navigator.userAgent.replace(/^.*(OS [0-9_]+|Version\/[0-9.]+).*$/, "$1")];
              var rect = document.body.getBoundingClientRect();
              lines.push("body top=" + Math.round(rect.top) + " h=" + Math.round(rect.height) + " · root bottom=" + Math.round(document.getElementById("root").getBoundingClientRect().bottom));
              log.forEach(function (e) { lines.push(e.t + "ms " + e.why + " ih=" + e.ih + " vvh=" + e.vvh + " ot=" + e.vvot + " pt=" + e.vvpt + " sy=" + e.sy + " dsh=" + e.dsh + " app=" + e.apph); });
              o.textContent = lines.join("\n");
            };
            render(); setInterval(render, 500);
          });
        }
      })();
    </script>

    <!-- The Aperture: an instant, dependency-free boot that paints on the
         first byte — before the module bundle or webfonts arrive — so the
         instrument never shows a blank frame. It carries no fabricated
         progress: at this stage the code itself is still loading, and the
         meridian only breathes. The React proof-boot removes this node the
         moment it mounts, continuing the same iris without a seam. -->
    <style>
      /* The iris is anchored at the exact viewport centre and every line of
         text is placed a fixed distance below it. The React proof-boot uses
         the identical geometry, so when it removes this node the eye and the
         wordmark never shift — the splash simply dissolves into the boot. */
      /* no fixed positioning anywhere in the document. Safari, opening a link
         from another app, can place a fixed layer against a stale viewport
         until the next touch; a static document has no layer to misplace. The
         body is exactly the visible height, so there is nothing to scroll. */
      html { height: 100%; overflow: hidden; overscroll-behavior: none; }
      body { position: relative; margin: 0; width: 100%; height: 100%; height: var(--app-h, 100dvh); overflow: hidden; overscroll-behavior: none; }
      #boot {
        position: absolute; top: 0; left: 0; width: 100%;
        height: 100vh; height: var(--app-h, 100dvh); z-index: 200;
        background: #f4f3ee; color: #101215;
        --ap-accent: #d61732; --ap-line: rgba(16,18,21,.16);
        --ap-faint: #686f78; --ap-ghost: #9aa0a7;
        transition: opacity .34s cubic-bezier(.22,.61,.36,1);
        -webkit-tap-highlight-color: transparent;
      }
      html[data-ground="dark"] #boot {
        background: #050507; color: #ffffff;
        --ap-accent: #e31937; --ap-line: rgba(255,255,255,.15);
        --ap-faint: #f2f4f6; --ap-ghost: #e3e6ea;
      }
      #boot.ap-out { opacity: 0; pointer-events: none; }
      #boot .ap-core {
        position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      }
      #boot .ap-lens {
        position: absolute; width: 232px; height: 232px; border-radius: 50%;
        top: 50%; left: 50%; transform: translate(-50%, -50%);
        background:
          radial-gradient(58% 58% at 50% 38%, rgba(255,255,255,.10), transparent 70%),
          radial-gradient(closest-side, color-mix(in srgb, var(--ap-accent) 5%, transparent), transparent 78%);
        border: 1px solid var(--ap-line);
        box-shadow: inset 0 1px 0 rgba(255,255,255,.22), 0 30px 80px rgba(0,0,0,.10);
        opacity: .5; animation: apLens 1s cubic-bezier(.22,.61,.36,1) both;
      }
      html[data-ground="dark"] #boot .ap-lens {
        box-shadow: inset 0 1px 0 rgba(255,255,255,.10), 0 40px 120px rgba(0,0,0,.6);
      }
      #boot .ap-iris { display: block; overflow: visible; position: relative; }
      #boot .ap-ring {
        transform-box: fill-box; transform-origin: center;
        animation: apRingIn .95s cubic-bezier(.22,.61,.36,1) both,
                   apSpin 16s linear .95s infinite;
      }
      #boot .ap-pupil {
        fill: var(--ap-accent); transform-box: fill-box; transform-origin: center;
        animation: apPupil .7s cubic-bezier(.34,1.4,.5,1) .42s both;
      }
      #boot .ap-below {
        position: absolute; top: 50%; left: 50%; transform: translateX(-50%);
        margin-top: 66px; display: flex; flex-direction: column; align-items: center;
        text-align: center; white-space: nowrap;
      }
      #boot .ap-word {
        font-family: "Big Shoulders", "Arial Narrow", sans-serif;
        font-weight: 700; font-size: 30px; letter-spacing: .34em;
        text-indent: .34em; text-transform: uppercase; line-height: 1;
        animation: apRise .7s cubic-bezier(.22,.61,.36,1) .28s both;
      }
      #boot .ap-sub {
        margin-top: 9px;
        font-family: "B612 Mono", "SF Mono", Menlo, monospace;
        font-size: 9.5px; letter-spacing: .32em; text-indent: .32em;
        text-transform: uppercase; color: var(--ap-faint);
        animation: apRise .7s cubic-bezier(.22,.61,.36,1) .4s both;
      }
      #boot .ap-track {
        position: relative; width: 168px; height: 1px; margin-top: 30px;
        background: var(--ap-line); overflow: hidden;
        animation: apRise .7s cubic-bezier(.22,.61,.36,1) .52s both;
      }
      #boot .ap-glint {
        position: absolute; top: 0; left: 0; height: 100%; width: 46px;
        background: linear-gradient(90deg, transparent, var(--ap-accent), transparent);
        animation: apGlint 1.65s cubic-bezier(.5,0,.5,1) .7s infinite;
      }
      #boot .ap-status {
        margin-top: 13px;
        font-family: "B612 Mono", "SF Mono", Menlo, monospace;
        font-size: 9.5px; letter-spacing: .2em; text-transform: uppercase;
        color: var(--ap-ghost);
        animation: apRise .7s cubic-bezier(.22,.61,.36,1) .64s both;
      }
      @keyframes apLens  { from { opacity: 0; transform: translate(-50%,-50%) scale(.82); } to { opacity: .5; } }
      @keyframes apRingIn{ from { opacity: 0; transform: rotate(-46deg) scale(.62); } to { opacity: 1; transform: rotate(0) scale(1); } }
      @keyframes apSpin  { to { transform: rotate(360deg); } }
      @keyframes apPupil { from { opacity: 0; transform: scale(0); } to { opacity: 1; transform: scale(1); } }
      @keyframes apRise  { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: none; } }
      @keyframes apGlint { 0% { transform: translateX(-52px); } 100% { transform: translateX(168px); } }
      @media (prefers-reduced-motion: reduce) {
        #boot .ap-lens, #boot .ap-ring, #boot .ap-pupil,
        #boot .ap-word, #boot .ap-sub, #boot .ap-track, #boot .ap-status { animation: none; opacity: 1; }
        #boot .ap-lens { transform: translate(-50%,-50%); }
        #boot .ap-glint { animation: none; opacity: .6; }
      }
    </style>
  </head>
  <body>
    <div id="boot" aria-hidden="true">
      <div class="ap-core">
        <div class="ap-lens"></div>
        <svg class="ap-iris" viewBox="0 0 240 240" width="80" height="80" aria-hidden="true">
          <circle class="ap-ring" cx="120" cy="120" r="84" fill="none" stroke="currentColor"
                  stroke-width="24" stroke-linecap="round" stroke-dasharray="454.5 73.3"
                  transform="rotate(-20 120 120)" />
          <circle class="ap-pupil" cx="133" cy="107" r="27" />
        </svg>
      </div>
      <div class="ap-below">
        <div class="ap-word">REIYAH</div>
        <div class="ap-track"><span class="ap-glint"></span></div>
        <div class="ap-status">initializing</div>
      </div>
    </div>
    <div id="root"></div>
    <script>
      /* Boot watchdog — the instrument must never freeze on its splash. The
         module bundle can fail to execute when a stale service worker pairs a
         cached page with asset hashes a later deploy has purged (the classic
         installed-PWA staleness). This classic script runs even when the
         module bundle does not. If React has not taken over the splash within
         the budget, recover exactly once: drop every service worker and cache,
         then reload clean from the network. A sessionStorage guard makes a
         reload loop impossible; if recovery already ran and it is still stuck,
         it shows an honest manual hint instead of looping. */
      (function () {
        setTimeout(function () {
          if (!document.getElementById("boot")) return; /* React took over — healthy */
          var s = document.querySelector("#boot .ap-status");
          try {
            if (sessionStorage.getItem("harbor-recovering")) {
              if (s) s.textContent = "still loading — close and reopen the app";
              return;
            }
            sessionStorage.setItem("harbor-recovering", "1");
          } catch (e) {}
          if (s) s.textContent = "refreshing instrument";
          var jobs = [];
          try {
            if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations)
              jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
                return Promise.all(rs.map(function (r) { return r.unregister(); }));
              }));
          } catch (e) {}
          try {
            if (window.caches && caches.keys)
              jobs.push(caches.keys().then(function (ks) {
                return Promise.all(ks.map(function (k) { return caches.delete(k); }));
              }));
          } catch (e) {}
          Promise.all(jobs).catch(function () {}).then(function () {
            location.reload();
          });
        }, 6500);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
