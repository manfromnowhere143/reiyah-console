  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#050507" />
    <script>
      /* ground restore, before first paint — no flash, ever */
      (function () {
        try {
          var g = localStorage.getItem("harbor-ground") || "dark";
          document.documentElement.dataset.ground = g;
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.content = g === "dark" ? "#050507" : "#f4f3ee";
        } catch (e) {
          document.documentElement.dataset.ground = "dark";
        }
      })();
      /* Exact app height and an unscrollable document — the iOS contract.
         A fixed root sized by 100vh or 100dvh can lock to the wrong viewport
         on first paint and never recover until a reload. Two facts must hold
         at every moment: (1) --app-h equals the real visible height, and (2)
         the document is scrolled to 0, because on iOS a fixed root above a
         scrolled document appears pushed off the top of the screen. Both are
         re-established at every moment they can change: resize, orientation,
         bfcache restore, the visual viewport's own resize and scroll, page
         scroll, and several timeouts after load to catch the toolbar settle
         Safari does not always signal.
         Diagnostics: open the site with ?diag=1 to see the live readings and
         the timeline of what the browser reported since the first byte. */
      (function () {
        var d = document.documentElement;
        var log = (window.__harborLog = []);
        var t0 = performance.now();
        function reading(why) {
          var vv = window.visualViewport;
          return {
            t: Math.round(performance.now() - t0), why: why,
            ih: window.innerHeight, iw: window.innerWidth,
            vvh: vv ? Math.round(vv.height) : null, vvw: vv ? Math.round(vv.width) : null,
            vvot: vv ? Math.round(vv.offsetTop) : null, vvpt: vv ? Math.round(vv.pageTop) : null,
            vvs: vv ? +vv.scale.toFixed(3) : null,
            sy: Math.round(window.scrollY || window.pageYOffset || 0),
            dch: d.clientHeight, dsh: d.scrollHeight, sh: screen.height,
            apph: d.style.getPropertyValue("--app-h")
          };
        }
        var lastH = 0;
        function setH(why) {
          var r = reading(why);
          /* the smaller of the two viewport heights: never taller than what is
             visible, so the dock can never sit below the screen */
          var h = r.vvh && r.ih ? Math.min(r.vvh, r.ih) : (r.vvh || r.ih);
          var changed = h && h !== lastH;
          if (changed || (why !== "raf" && why !== "tick")) { if (log.length < 80) log.push(r); }
          if (changed) { lastH = h; d.style.setProperty("--app-h", h + "px"); }
          if (r.sy || r.vvpt) { try { window.scrollTo(0, 0); } catch (e) {} }
        }
        var fire = function (why) { return function () { setH(why); }; };
        setH("first");
        /* track the visual viewport continuously: every frame while the page
           settles (Safari does not always signal a toolbar appearing during a
           tab-open), then twice a second for the life of the page. One property
           read per frame; writes only on change. */
        var settleUntil = performance.now() + 12000;
        (function loop() { setH("raf"); if (performance.now() < settleUntil) requestAnimationFrame(loop); else setInterval(fire("tick"), 500); })();
        addEventListener("resize", fire("resize"), { passive: true });
        addEventListener("scroll", fire("scroll"), { passive: true });
        addEventListener("orientationchange", function () { setH("orient"); setTimeout(fire("orient+300"), 300); });
        addEventListener("pageshow", fire("pageshow"));
        addEventListener("focus", fire("focus"));
        document.addEventListener("visibilitychange", fire("visibility"));
        if (window.visualViewport) {
          window.visualViewport.addEventListener("resize", fire("vv.resize"), { passive: true });
          window.visualViewport.addEventListener("scroll", fire("vv.scroll"), { passive: true });
        }
        addEventListener("DOMContentLoaded", fire("dom"));
        addEventListener("load", function () {
          setH("load");
          [60, 250, 600, 1200, 2500].forEach(function (ms) { setTimeout(fire("load+" + ms), ms); });
        });
        /* ---- the diagnostic overlay: readings, not assumptions ---- */
        if (/[?&]diag=1/.test(location.search)) {
          addEventListener("DOMContentLoaded", function () {
            var o = document.createElement("pre");
            o.id = "diag";
            o.style.cssText = "position:absolute;left:0;right:0;top:35%;margin:0;z-index:100000;background:rgba(255,220,0,.94);color:#000;font:10px/1.35 Menlo,monospace;padding:6px 8px;white-space:pre-wrap;word-break:break-all;pointer-events:none;max-height:60%;overflow:hidden";
            document.body.appendChild(o);
            var render = function () {
              var r = reading("now");
              var lines = ["NOW ih=" + r.ih + " vvh=" + r.vvh + " vvot=" + r.vvot + " vvpt=" + r.vvpt + " sy=" + r.sy + " dch=" + r.dch + " dsh=" + r.dsh + " sh=" + r.sh + " apph=" + r.apph + " ua=" + navigator.userAgent.replace(/^.*(OS [0-9_]+|Version\/[0-9.]+).*$/, "$1")];
              var rect = document.body.getBoundingClientRect();
              var dock = document.querySelector(".dock"); var dr = dock ? dock.getBoundingClientRect() : null;
              lines.push("body top=" + Math.round(rect.top) + " h=" + Math.round(rect.height) + " · root bottom=" + Math.round(document.getElementById("root").getBoundingClientRect().bottom) + (dr ? " · dock top=" + Math.round(dr.top) + " bottom=" + Math.round(dr.bottom) + " vis=" + (dr.bottom <= (window.visualViewport ? window.visualViewport.height : window.innerHeight) + 1 ? "YES" : "NO") : " · dock: none"));
              log.forEach(function (e) { lines.push(e.t + "ms " + e.why + " ih=" + e.ih + " vvh=" + e.vvh + " ot=" + e.vvot + " pt=" + e.vvpt + " sy=" + e.sy + " dsh=" + e.dsh + " app=" + e.apph); });
              o.textContent = lines.join("\n");
            };
            render(); setInterval(render, 500);
          });
        }
      })();
    </script>

    <!-- The first-byte opening and React use one style sheet and one geometry.
         No remote CSS request stands between the document and its first paint. -->
    <style>
      @font-face { font-family: "Big Shoulders"; font-style: normal; font-weight: 500 700; font-display: swap; src: url("/fonts/big-shoulders-500-600-700-latin.5faff1f81e.woff2") format("woff2"); }
      @font-face { font-family: "Instrument Sans"; font-style: normal; font-weight: 400 600; font-display: swap; src: url("/fonts/instrument-sans-400-500-600-latin.6219bc4bfd.woff2") format("woff2"); }
      @font-face { font-family: "B612 Mono"; font-style: normal; font-weight: 400; font-display: swap; src: url("/fonts/b612-mono-400-latin.36625fd347.woff2") format("woff2"); }
      @font-face { font-family: "B612 Mono"; font-style: normal; font-weight: 700; font-display: swap; src: url("/fonts/b612-mono-700-latin.76dc8f1668.woff2") format("woff2"); }
      html { height: 100%; overflow: hidden; overscroll-behavior: none; background: #f4f3ee; }
      html[data-ground="dark"] { background: #050507; }
      body { position: relative; margin: 0; width: 100%; height: 100%; height: var(--app-h, 100dvh); overflow: hidden; overscroll-behavior: none; }
      .opening {
        --op-ground: #f4f3ee; --op-ink: #101215; --op-line: rgba(16,18,21,.17); --op-accent: #d61732;
        position: absolute; inset: 0; width: 100%; height: 100vh; height: var(--app-h, 100dvh);
        z-index: 100; background: var(--op-ground); color: var(--op-ink); overflow: hidden;
        font-family: "Instrument Sans", sans-serif; box-sizing: border-box;
      }
      html[data-ground="dark"] .opening { --op-ground: #050507; --op-ink: #fff; --op-line: rgba(255,255,255,.19); --op-accent: #e31937; }
      .opening *, .opening *::before, .opening *::after { box-sizing: border-box; }
      #boot { z-index: 200; }
      .opening-mast { position: absolute; top: max(24px, env(safe-area-inset-top)); right: 36px; }
      .opening .groundtoggle { position: static; width: 36px; height: 36px; backdrop-filter: none; -webkit-backdrop-filter: none; }
      .opening-field { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; width: min(300px, calc(100% - 48px)); }
      .opening-optic { display: block; width: 88px; height: 88px; overflow: visible; }
      .opening-pupil { fill: var(--op-accent); }
      .opening-word { margin-top: 24px; color: var(--op-ink); font: 500 20px/1 "Instrument Sans", "Helvetica Neue", Arial, sans-serif; letter-spacing: .24em; text-indent: .24em; }
      /* A single reflection on the mark, with no rotating loader or timed hold. */
      .opening-reflection { transform-box: view-box; animation: openingLight 1800ms cubic-bezier(.45,0,.2,1) both; }
      @keyframes openingLight { from { transform: translateX(-100%); } to { transform: translateX(100%); } }
      .opening-console { position: absolute; top: calc(50% + 118px); left: 50%; transform: translateX(-50%); width: min(320px, calc(100% - 64px)); }
      .opening-progress, .opening-status { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
      .opening-status[data-error="true"] { position: static; width: auto; height: auto; margin: 0; overflow: visible; clip-path: none; white-space: normal; text-align: center; font-size: 12px; }
      .opening[data-leaving="true"] { animation: openingExit 360ms cubic-bezier(.4,0,.2,1) forwards; }
      @keyframes openingExit { to { opacity: 0; } }
      .opening-blocked { text-align: center; }
      .opening-blocked h1 { font: 500 17px/1.3 "Instrument Sans", sans-serif; margin: 0 0 8px; }
      .opening-blocked p { font-size: 12px; line-height: 1.5; margin: 0 0 12px; }
      .opening-blocked details { font-size: 10px; }
      .opening-blocked summary { cursor: pointer; }
      .opening-blocked code { display: block; margin-top: 8px; font: 9px/1.5 "B612 Mono", monospace; overflow-wrap: anywhere; max-height: 54px; overflow-y: auto; }
      .opening-blocked button { min-height: 44px; display: inline-flex; align-items: center; gap: 18px; margin-top: 12px; padding: 8px 18px; border: 1px solid var(--op-line); border-radius: 8px; color: inherit; background: transparent; font: 12px "Instrument Sans", sans-serif; cursor: pointer; }
      .opening-blocked button:focus-visible { outline: 1px solid currentColor; outline-offset: 4px; }
      .opening[data-blocked="true"] .opening-field { top: 34%; }
      .opening[data-blocked="true"] .opening-console { top: 53%; }
      @media (max-width: 760px) {
        .opening-mast { right: 24px; top: max(18px, env(safe-area-inset-top)); }
        .opening-optic { width: 80px; height: 80px; }
        .opening-word { font-size: 18px; margin-top: 22px; }
      }
      @media (max-height: 500px) {
        .opening[data-blocked="true"] .opening-field { top: 24%; }
        .opening[data-blocked="true"] .opening-optic { display: none; }
        .opening[data-blocked="true"] .opening-console { top: 38%; }
      }
      @media (prefers-reduced-motion: reduce) {
        .opening-reflection, .opening[data-leaving="true"] { animation: none; }
        .opening-reflection { display: none; }
      }
    </style>

      <svg class="opening-optic" viewBox="0 0 240 240" aria-hidden="true">

            <stop offset=".48" stop-color="currentColor" stop-opacity=".84" />
            <stop offset=".7" stop-color="currentColor" stop-opacity=".74" />
            <stop offset="1" stop-color="currentColor" stop-opacity=".96" />
          </linearGradient>
          <linearGradient id="opening-light">
            <stop offset=".25" stop-color="white" stop-opacity="0" />
            <stop offset=".5" stop-color="white" stop-opacity=".3" />
            <stop offset=".75" stop-color="white" stop-opacity="0" />
          </linearGradient>
        </defs>
        <g mask="url(#opening-mark)">
          <path d="M0 0h240v240H0z" fill="url(#opening-metal)" />
          <g class="opening-reflection"><path d="M0 0h240v240H0z" fill="url(#opening-light)" /></g>
        </g>
        <circle cx="133" cy="107" r="27" class="opening-pupil" />

        <div class="opening-word">REIYAH</div>

      <div class="opening-console"><div class="opening-status">Loading instrument</div></div>
    </div>
    <div id="root"></div>
    <script>
      /* Boot watchdog — the instrument must never freeze on its splash. The
         module bundle can fail to execute when a stale service worker pairs a
         cached page with asset hashes a later deploy has purged (the classic
         installed-PWA staleness). This classic script runs even when the
         module bundle does not. If React has not taken over the splash within
         the budget, recover exactly once: drop every service worker and cache,
         then reload clean from the network. A sessionStorage guard makes a
         reload loop impossible; if recovery already ran and it is still stuck,
         it shows an honest manual hint instead of looping. */
      (function () {
        setTimeout(function () {
          if (!document.getElementById("boot")) return; /* React took over — healthy */
          var s = document.querySelector("#boot .opening-status");
          if (s) s.setAttribute("data-error", "true");
          try {
            if (sessionStorage.getItem("harbor-recovering")) {
              if (s) s.textContent = "still loading — close and reopen the app";
              return;
            }
            sessionStorage.setItem("harbor-recovering", "1");
          } catch (e) {}
          if (s) s.textContent = "refreshing instrument";
          var jobs = [];
          try {
            if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations)
              jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
                return Promise.all(rs.map(function (r) { return r.unregister(); }));
              }));
          } catch (e) {}
          try {
            if (window.caches && caches.keys)
              jobs.push(caches.keys().then(function (ks) {
                return Promise.all(ks.map(function (k) { return caches.delete(k); }));
              }));
          } catch (e) {}
          Promise.all(jobs).catch(function () {}).then(function () {
            location.reload();
          });
        }, 6500);
      })();
    </script>
